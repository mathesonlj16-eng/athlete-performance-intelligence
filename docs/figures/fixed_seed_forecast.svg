<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Single-seed synthetic demonstration"><title>Single-seed synthetic demonstration</title><desc>MAE: lower is better | seed 42 | not externally validated</desc><rect width="900" height="400" rx="15" fill="#fbfcff"/><text x="32" y="40" fill="#172554" font-family="Arial,sans-serif" font-size="21" font-weight="bold">Single-seed synthetic demonstration</text><text x="32" y="65" fill="#475569" font-family="Arial,sans-serif" font-size="12">MAE: lower is better | seed 42 | not externally validated</text><text x="565" y="92" font-size="12" fill="#475569" font-family="Arial">Persistence vs. validation-selected boosting</text><text x="35" y="111" font-family="Arial" font-weight="bold" font-size="16" fill="#172554">Countermovement jump</text><text x="40" y="148" font-family="Arial" font-size="13" fill="#475569">Last value</text><rect x="205" y="129" width="349.0" height="27" rx="4" fill="#64748b"/><text x="563.0" y="149" font-family="Arial" font-size="13" fill="#1f2937">0.800 cm</text><text x="40" y="191" font-family="Arial" font-size="13" fill="#475569">Gradient boosting</text><rect x="205" y="172" width="325.8" height="27" rx="4" fill="#0d9488"/><text x="539.8" y="192" font-family="Arial" font-size="13" fill="#1f2937">0.747 cm</text><text x="35" y="260" font-family="Arial" font-weight="bold" font-size="16" fill="#172554">Grip strength</text><text x="40" y="297" font-family="Arial" font-size="13" fill="#475569">Last value</text><rect x="205" y="278" width="424.0" height="27" rx="4" fill="#64748b"/><text x="638.0" y="298" font-family="Arial" font-size="13" fill="#1f2937">0.972 kg</text><text x="40" y="340" font-family="Arial" font-size="13" fill="#475569">Gradient boosting</text><rect x="205" y="321" width="378.3" height="27" rx="4" fill="#0d9488"/><text x="592.3" y="341" font-family="Arial" font-size="13" fill="#1f2937">0.867 kg</text><text x="38" y="377" font-family="Arial" font-size="12" fill="#64748b">Compare results only within the same metric and unit. All data are fictional.</text></svg>