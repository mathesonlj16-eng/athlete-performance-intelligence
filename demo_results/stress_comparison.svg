<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="585" viewBox="0 0 1050 585" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Synthetic walk-forward forecasting improvements versus persistence</title>
<desc id="chart-desc">Mean percentage reduction in mean absolute error from repeated synthetic experiments. Smooth: jump -0.29, grip -3.40. Noisy: jump +10.87, grip +7.68. Irregular: jump +0.06, grip -1.81. Random walk: both zero. Negative numbers mean baseline performed better. Simulated data only.</desc>
<rect width="1050" height="585" rx="12" fill="#fff"/>
<text x="22" y="43" fill="#13243b" font-family="Arial, sans-serif" font-size="25" font-weight="700">When does the forecasting model actually help?</text>
<text x="22" y="70" fill="#53677b" font-family="Arial, sans-serif" font-size="15">Mean test-error reduction vs last-observation baseline · 3 seeds × 3 time folds per scenario</text>
<rect x="23" y="91" width="14" height="14" rx="2" fill="#1766b2"/><text x="44" y="103" font-family="Arial, sans-serif" font-size="15" fill="#172b47">Jump height</text>
<rect x="180" y="91" width="14" height="14" rx="2" fill="#df7850"/><text x="201" y="103" font-family="Arial, sans-serif" font-size="15" fill="#172b47">Grip strength</text>
<text x="810" y="104" font-family="Arial, sans-serif" font-size="14" fill="#53677b">Higher is better →</text>
<g font-family="Arial, sans-serif"><line x1="295" y1="125" x2="295" y2="465" stroke="#dbe1e8" stroke-width="1"/><text x="295" y="486" text-anchor="middle" font-size="14" fill="#475569">-5%</text><line x1="510" y1="125" x2="510" y2="465" stroke="#53677b" stroke-width="2"/><text x="510" y="486" text-anchor="middle" font-size="14" fill="#475569">0%</text><line x1="725" y1="125" x2="725" y2="465" stroke="#dbe1e8" stroke-width="1"/><text x="725" y="486" text-anchor="middle" font-size="14" fill="#475569">+5%</text><line x1="940" y1="125" x2="940" y2="465" stroke="#dbe1e8" stroke-width="1"/><text x="940" y="486" text-anchor="middle" font-size="14" fill="#475569">+10%</text><text x="22" y="176" fill="#172b47" font-size="17" font-weight="600">Smooth</text><rect x="497.48" y="151" width="12.52" height="18" rx="4" fill="#1766b2"/><text x="485.4827" y="165" font-size="15" text-anchor="end" fill="#202c3a" font-weight="600">-0.29%</text><rect x="364.00" y="178" width="146.00" height="18" rx="4" fill="#df7850"/><text x="351.9978" y="192" font-size="15" text-anchor="end" fill="#202c3a" font-weight="600">-3.40%</text><text x="22" y="255" fill="#172b47" font-size="17" font-weight="600">Noisy</text><rect x="510.00" y="230" width="467.34" height="18" rx="4" fill="#1766b2"/><text x="989.3412" y="244" font-size="15" text-anchor="start" fill="#202c3a" font-weight="600">+10.87%</text><rect x="510.00" y="257" width="330.30" height="18" rx="4" fill="#df7850"/><text x="852.3045" y="271" font-size="15" text-anchor="start" fill="#202c3a" font-weight="600">+7.68%</text><text x="22" y="334" fill="#172b47" font-size="17" font-weight="600">Irregular visits</text><circle cx="510" cy="318" r="4" fill="#1766b2"/><text x="524.6875" y="323" font-size="15" text-anchor="start" fill="#202c3a" font-weight="600">+0.06%</text><rect x="432.23" y="336" width="77.77" height="18" rx="4" fill="#df7850"/><text x="420.2345" y="350" font-size="15" text-anchor="end" fill="#202c3a" font-weight="600">-1.81%</text><text x="22" y="413" fill="#172b47" font-size="17" font-weight="600">Random walk</text><circle cx="510" cy="397" r="4" fill="#1766b2"/><text x="524" y="402" font-size="15" text-anchor="start" fill="#202c3a" font-weight="600">0.00%</text><circle cx="510" cy="424" r="4" fill="#df7850"/><text x="524" y="429" font-size="15" text-anchor="start" fill="#202c3a" font-weight="600">0.00%</text></g>
<text x="22" y="524" fill="#344256" font-family="Arial, sans-serif" font-size="15" font-weight="600">Negative values: baseline wins. Zero: no improvement.</text>
<text x="22" y="549" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Illustrative synthetic experiments only, not independent real-athlete validation.</text>
</svg>
